name: Build Rica Water Tracker APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" -type f | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository root."
            exit 1
          fi
          mkdir project
          unzip -o "$ZIP_FILE" -d project
          echo "PROJECT_DIR=$(dirname "$(find project -name package.json -type f | head -n 1)")" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install
          npx cap add android || true
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rica-Water-Tracker-APK
          path: project/**/android/app/build/outputs/apk/debug/app-debug.apk
